[project]
name = "mcp-spark-ui"
version = "0.1.0"
description = "Minimal MCP server that reads classic Spark UI via Databricks driver-proxy"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.12",
  "mcp[cli]>=1.14.0",
  "uvicorn>=0.34.2",
  "databricks-sdk>=0.60.0",
  "pydantic>=2",
  "fastmcp>=2.12.5",
]

[project.scripts]
custom-mcp-server = "server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]
